<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">EAC runtime architecture</title><desc id="desc">The Tauri shell exchanges RPC messages with a Node sidecar. DPX prepares the environment in which the sidecar launches official dsh. Plugins extend dsh.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1730"/><stop offset="1" stop-color="#182c45"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8bb6d1" stroke-width="1.5"/></marker></defs>
<rect width="920" height="360" rx="24" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="36" y="43" fill="#7bd6e4" font-size="12" letter-spacing="3">ENGINEERING / CLEAR BOUNDARIES</text>
<text x="36" y="78" fill="#f1f5fb" font-size="25" font-weight="600">One desktop. Three layers.</text>
<rect x="281" y="105" width="603" height="185" rx="20" fill="#142d3b" stroke="#407981" stroke-dasharray="5 5"/>
<text x="302" y="133" fill="#8ccfcb" font-size="13">DPX prepares runtime variables and default data paths</text>
<rect x="36" y="158" width="206" height="107" rx="14" fill="#1c324e" stroke="#45627f"/>
<text x="54" y="187" fill="#8edbea" font-size="12">L1 / NATIVE</text><text x="54" y="215" fill="#f1f5fb" font-size="20" font-weight="600">Tauri shell</text><text x="54" y="243" fill="#b0c1d8" font-size="13">Window · tray · lifecycle</text>
<rect x="302" y="158" width="239" height="107" rx="14" fill="#25324c" stroke="#69799e"/>
<text x="320" y="187" fill="#c0b7fa" font-size="12">L2 / COORDINATION</text><text x="320" y="215" fill="#f1f5fb" font-size="20" font-weight="600">Node sidecar</text><text x="320" y="243" fill="#b0c1d8" font-size="13">Boot · RPC · desktop services</text>
<rect x="622" y="158" width="239" height="107" rx="14" fill="#203c42" stroke="#4a8789"/>
<text x="640" y="187" fill="#91dec8" font-size="12">L3 / OFFICIAL KERNEL</text><text x="640" y="215" fill="#f1f5fb" font-size="20" font-weight="600">DeepSeek Harness</text><text x="640" y="243" fill="#b0c1d8" font-size="13">Web UI · agents · extensions</text>
<path d="M245 215H296M546 215H616" stroke="#8bb6d1" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="258" y="199" fill="#b0c1d8" font-size="11">RPC</text><text x="557" y="199" fill="#b0c1d8" font-size="11">launch</text>
<text x="36" y="327" fill="#98abc5" font-size="13">Architecture illustration</text><text x="302" y="327" fill="#98abc5" font-size="13">Environment isolation redirects defaults; it is not a filesystem sandbox.</text>
</g></svg>
