<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">EAC · Desktop runtime flow</title><desc id="desc">Launch the Tauri shell, start the Node sidecar, initialize DPX, prepare profiles and plugins, launch dsh, and present the Web UI. Initialization failure stops startup. Desktop actions return through the bridge.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#9bb7e3" stroke-width="1.6"/></marker></defs>
<rect width="1000" height="620" rx="18" fill="#0f1420"/>
<g font-family="Segoe UI,Arial,sans-serif">
<rect x="34" y="35" width="10" height="10" fill="#4b6fff"/><text x="58" y="48" fill="#e8e6e0" font-size="25" font-weight="700">EAC / Runtime flow</text><text x="34" y="77" fill="#abc2ec" font-size="14">NATIVE SHELL → ISOLATED ENVIRONMENT → HARNESS WORKSPACE</text>
<g stroke="#5e88cc" fill="#182137"><rect x="34" y="120" width="265" height="100" rx="12"/><rect x="366" y="120" width="265" height="100" rx="12"/><rect x="699" y="120" width="267" height="100" rx="12"/></g>
<g fill="#e8e6e0" font-size="21" font-weight="600"><text x="55" y="156">01 · Tauri shell</text><text x="387" y="156">02 · Node sidecar</text><text x="720" y="156">03 · DPX environment</text></g>
<g fill="#abc2ec" font-size="14"><text x="55" y="184">Window · tray · single instance</text><text x="55" y="204">Pass data root and channel</text><text x="387" y="184">Desktop services · RPC dispatch</text><text x="387" y="204">Initialize before reading profiles</text><text x="720" y="184">Create / reuse environment</text><text x="720" y="204">Apply paths and runtime variables</text></g>
<g fill="none" stroke="#9bb7e3" stroke-width="2" marker-end="url(#arrow)"><path d="M300 170H359"/><path d="M632 170H692"/><path d="M832 220V330"/><path d="M699 380H638"/><path d="M366 380H306"/></g>
<g fill="#abc2ec" font-size="12"><text x="306" y="156">stdio RPC</text><text x="640" y="156">prepare</text><text x="844" y="276">ready</text><text x="641" y="365">spawn</text><text x="307" y="365">HTTP ready</text></g>
<g stroke="#5e88cc" fill="#182137"><rect x="699" y="330" width="267" height="100" rx="12"/><rect x="366" y="330" width="265" height="100" rx="12"/><rect x="34" y="330" width="265" height="100" rx="12"/></g>
<g fill="#e8e6e0" font-size="21" font-weight="600"><text x="720" y="366">04 · Profile &amp; plugins</text><text x="387" y="366">05 · Harness kernel</text><text x="55" y="366">06 · Web workspace</text></g>
<g fill="#abc2ec" font-size="14"><text x="720" y="394">web-desktop profile</text><text x="720" y="414">Sync companion capabilities</text><text x="387" y="394">Launch dsh · wait for readiness</text><text x="387" y="414">Agents · tools · conversations</text><text x="55" y="394">Open the local Web UI</text><text x="55" y="414">Review tasks and file changes</text></g>
<rect x="366" y="247" width="265" height="54" rx="9" fill="#33222b" stroke="#cd8293"/><text x="386" y="280" fill="#f1b6c4" font-size="15">Initialization error → stop &amp; log</text><path d="M740 220V274H638" fill="none" stroke="#cd8293" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M166 330V270H20V104H498V120" fill="none" stroke="#6a87bb" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="34" y="470" width="932" height="110" rx="12" fill="#131d2c" stroke="#324665"/><text x="54" y="499" fill="#e8e6e0" font-size="17" font-weight="600">Desktop actions return through the bridge</text><text x="54" y="525" fill="#abc2ec" font-size="14">Web UI → bridge → sidecar → native shell     ·     Protocol output and diagnostic logs stay separate</text><text x="54" y="553" fill="#8c9bb5" font-size="13">DPX redirects default paths and environment variables; it does not provide a filesystem sandbox.</text>
</g></svg>
