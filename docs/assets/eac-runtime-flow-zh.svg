<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">EAC · 桌面运行流程</title><desc id="desc">Launch the Tauri shell, start the Node sidecar, initialize DPX, 准备 profiles and plugins, launch dsh, and present the Web UI. Initialization failure stops startup. 桌面操作通过桥接层返回宿主.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#9bb7e3" stroke-width="1.6"/></marker></defs>
<rect width="1000" height="620" rx="18" fill="#0f1420"/>
<g font-family="Microsoft YaHei,Segoe UI,Arial,sans-serif">
<rect x="34" y="35" width="10" height="10" fill="#4b6fff"/><text x="58" y="48" fill="#e8e6e0" font-size="25" font-weight="700">EAC / 架构与运行流程</text><text x="34" y="77" fill="#abc2ec" font-size="14">原生桌面壳 → 独立运行环境 → Harness 工作台</text>
<g stroke="#5e88cc" fill="#182137"><rect x="34" y="120" width="265" height="100" rx="12"/><rect x="366" y="120" width="265" height="100" rx="12"/><rect x="699" y="120" width="267" height="100" rx="12"/></g>
