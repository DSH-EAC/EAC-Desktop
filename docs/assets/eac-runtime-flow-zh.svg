<g fill="#e8e6e0" font-size="21" font-weight="600"><text x="720" y="366">04 · 配置与插件</text><text x="387" y="366">05 · Harness 内核</text><text x="55" y="366">06 · Web 工作台</text></g>
<g fill="#abc2ec" font-size="14"><text x="720" y="394">web-desktop 配置环境</text><text x="720" y="414">同步桌面配套插件</text><text x="387" y="394">启动 dsh · 等待服务就绪</text><text x="387" y="414">智能体 · 工具 · 对话</text><text x="55" y="394">加载本地 Web UI</text><text x="55" y="414">审阅任务与文件变更</text></g>
