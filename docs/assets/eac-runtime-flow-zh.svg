<g fill="#abc2ec" font-size="14"><text x="55" y="184">窗口 · 托盘 · 单实例</text><text x="55" y="204">传递数据根与发布通道</text><text x="387" y="184">桌面服务 · RPC 分发</text><text x="387" y="204">读取配置前初始化运行环境</text><text x="720" y="184">创建或复用环境</text><text x="720" y="204">应用路径与运行时变量</text></g>
<g fill="none" stroke="#9bb7e3" stroke-width="2" marker-end="url(#arrow)"><path d="M300 170H359"/><path d="M632 170H692"/><path d="M832 220V330"/><path d="M699 380H638"/><path d="M366 380H306"/></g>
<g fill="#abc2ec" font-size="12"><text x="306" y="156">stdio RPC</text><text x="640" y="156">准备</text><text x="844" y="276">就绪</text><text x="641" y="365">启动</text><text x="307" y="365">HTTP 就绪</text></g>
